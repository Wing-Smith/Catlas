[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "osm-map-tool"
version = "0.1.0"
description = "OSM 地理数据自动抓取与制图工具：抓取/清洗/导出 GeoJSON、Shapefile、SVG、PNG"
requires-python = ">=3.14"
dependencies = [
    "PySide6>=6.10",
    "PyQt-Fluent-Widgets>=1.8.0",
    "geopandas>=1.1",
    "shapely>=2.1",
    "pyogrio>=0.11",
    "requests>=2.32",
    "tenacity>=9.0",
    "platformdirs>=4.3",
    "matplotlib>=3.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.pytest.ini_options]
testpaths = ["tests"]
